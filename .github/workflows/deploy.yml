# Checks every pull request, and ships the backend on every push to main: the steps Act 4 of the talk ran by hand.
# Repository settings it needs: secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD, variable SUPABASE_PROJECT_REF,
# and an environment named production (add required reviewers there if a person should approve each deploy).
# Until SUPABASE_PROJECT_REF is set the deploy job is skipped, so a fresh clone or a fork only runs the checks.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch at a time. A new push cancels a stale pull-request check, but never a deploy halfway through.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The app against the database types committed with the migration: a renamed column fails here.
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # The CLI version the talk was rehearsed with. Bump it on purpose, not by accident.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrations and seed
        run: supabase db push --linked --include-seed --yes
      - name: Lot photos
        run: supabase seed buckets --linked --yes
      - name: Project settings from config.toml
        run: supabase config push --yes
      - name: MCP server
        run: supabase functions deploy mcp --no-verify-jwt --yes
